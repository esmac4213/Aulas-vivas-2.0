<!DOCTYPE html>
<html lang="es">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Login</title>
	{% load static %}
	<link rel="stylesheet" href="{% static 'login.css' %}">
</head>
<body>
	<header class="login-header">
		<img src="{% static 'img/icono.png' %}" alt="Logotipo de Aulas Vivas">
		<h2>AULAS VIVAS</h2>
		<h3>UJAT</h3>
	</header>
	<main class="login-container">
		<h1>Iniciar sesión</h1>
		<p class="form-description">Ingresa tus datos para acceder al sistema.</p>
		<form action="#" method="post">
			{% csrf_token %}
			<div class="form-field">
				<label for="username">Usuario</label>
				<input type="text" id="username" name="nombre_usuario" autocomplete="username" placeholder="Nombre de usuario" required>
			</div>
			<div class="form-field">
				<label for="password">Contraseña</label>
				<input type="password" id="password" name="password" autocomplete="current-password" placeholder="Contraseña" required>
			</div>
			<button type="submit">Ingresar</button>
		</form>
	</main>
	<p style="transform: translate(0, -100px);">© 2024 Aulas Vivas. Todos los derechos reservados.</p>
</body>
</html>
